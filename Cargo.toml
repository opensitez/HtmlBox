[package]
name = "rhtmledit"
version = "0.1.0"
edition = "2021"
description = "HTML/CSS editor and renderer in Rust using tiny-skia"

[lib]
name = "rhtmledit"
path = "src/lib.rs"

[[bin]]
name = "rhtmledit"
path = "src/main.rs"

[[example]]
name = "contenteditable_demo"
path = "examples/contenteditable_demo.rs"

[[example]]
name = "markdown_demo"
path = "examples/markdown_demo.rs"

[[example]]
name = "print_demo"
path = "examples/print_demo.rs"

[[example]]
name = "layout_features"
path = "examples/layout_features.rs"

[[example]]
name = "cascade_features"
path = "examples/cascade_features.rs"

[[example]]
name = "transform_filter_demo"
path = "examples/transform_filter_demo.rs"

[dependencies]
tiny-skia = "0.11"
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"
cosmic-text = "0.18.2"
unicode-bidi = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.44"
encoding_rs = "0.8"
rand = "0.8"
