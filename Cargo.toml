[package]
name = "htmlbox"
version = "0.1.0"
edition = "2021"
description = "HTML/CSS editor and renderer in Rust using tiny-skia"
license = "MIT OR Apache-2.0" # REQUIRED: Standard Rust dual-license, or choose your own (e.g., "MIT")
repository = "https://github.com/your-username/htmlbox" # Recommended
readme = "README.md" # Recommended (if you have one)
keywords = ["html", "css", "rendering", "skia"] # Optional
categories = ["gui", "rendering", "web-programming"] # Optional

[lib]
name = "htmlbox"
path = "src/lib.rs"

[[bin]]
name = "htmlbox"
path = "src/main.rs"

[[example]]
name = "animation_demo"
path = "examples/animation_demo.rs"

[[example]]
name = "transitions_demo"
path = "examples/transitions_demo.rs"

[[example]]
name = "contenteditable_demo"
path = "examples/contenteditable_demo.rs"

[[example]]
name = "markdown_demo"
path = "examples/markdown_demo.rs"

[[example]]
name = "print_demo"
path = "examples/print_demo.rs"

[[example]]
name = "layout_features"
path = "examples/layout_features.rs"

[[example]]
name = "cascade_features"
path = "examples/cascade_features.rs"

[[example]]
name = "transform_filter_demo"
path = "examples/transform_filter_demo.rs"

[[example]]
name = "event_playground"
path = "examples/event_playground.rs"

[features]
accessibility = ["dep:accesskit", "dep:accesskit_winit"]

[dependencies]
accesskit        = { version = "0.17", optional = true }
accesskit_winit  = { version = "0.22", optional = true, features = ["rwh_06"] }
tiny-skia = "0.12"
winit = "0.30"
softbuffer = "0.4"
bytemuck = "1"
raw-window-handle = "0.6"
cosmic-text = "0.18.2"
# Glyph OUTLINES, for `strokeText`. Already in the tree as cosmic-text's own
# dependency at this exact version — naming it here does not add a crate, it
# makes the outline API reachable. cosmic-text re-exports the rasteriser
# (`SwashCache`) but not `scale::ScaleContext`, and a filled glyph is not a
# stroked one.
swash = "0.2"
# `toDataURL`. Already in the tree; the canvas needs it to hand a page its own
# pixels, which is the only export route the spec gives a `<canvas>`.
base64 = "0.21"
unicode-bidi = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.44"
encoding_rs = "0.8"
rand = "0.8"
reqwest = { version = "0.12", features = ["blocking", "gzip", "brotli", "deflate"] }
flate2 = "1"
rayon = "1.10"
